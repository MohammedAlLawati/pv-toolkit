# Publishes the static app in web/ to GitHub Pages. Runs only when started by hand
# (Actions > Pages > Run workflow) until publishing is switched on for this repo.
name: Pages
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site files (the app only, no tests or node_modules)
        run: |
          mkdir _site
          cp -r web/index.html web/icon.svg web/css web/js web/vendor web/templates web/data web/fonts _site/
          [ -f web/letters.html ] && cp web/letters.html _site/ || true
          touch _site/.nojekyll
      - name: Version the app's own scripts and stylesheets
        # GitHub Pages lets browsers keep files for 10 minutes, so after a publish they could run
        # the old scripts. Adding ?v=<commit> to every import makes them fetch the new ones at once.
        working-directory: _site
        run: |
          V="${GITHUB_SHA::7}"
          find js -name '*.js' -print0 | xargs -0 perl -pi -e '
            s#((?:\bfrom|\bimport)\s*\(?\s*)(["\x27])(\.{1,2}/[^"\x27?\s]+\.m?js)\2#$1$2$3?v='"$V"'$2#g;
            s#(\.js)`\)#$1?v='"$V"'`)#g;'
          perl -pi -e 's#((?:src|href)=")((?:js|css)/[^"?]+\.(?:js|css))"#$1$2?v='"$V"'"#g' index.html
          grep -q "js/app.js?v=$V" index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
